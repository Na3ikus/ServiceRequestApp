version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ServiceDeskDB
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=server=db;database=ServiceDeskDB;user=admin;password=password;port=3306
      - Jwt__Issuer=ServiceDeskSystem
      - Jwt__Audience=ServiceDeskSystem
      - Jwt__Key=SuperSecretKeyThatIsAtLeast32BytesLong!!!
    ports:
      - "5033:80"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - ApiBaseUrl=http://api:80
    ports:
      - "5034:80"
    depends_on:
      - api

volumes:
  mysql_data:

